name: 💡 Feature request
description: Suggest a new block type, integration or improvement.
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature and what it would let you do.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why?
      description: The use case or problem behind it.
  - type: textarea
    attributes:
      label: Alternatives you've considered
